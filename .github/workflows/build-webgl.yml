name: Field Day Unity Build

# One Unity WebGL build, published to Vault test builds (R2):
#   https://builds.vaultlearninggames.org/fieldday/atom-touch/<branch>/
# Deleting a branch removes its Vault build.
on:
   push:
   delete:
   workflow_dispatch:

concurrency:
    # Branch-delete runs get their own group so they never cancel a build of the same branch.
    group: ${{ github.workflow }}-${{ github.event_name == 'delete' && github.run_id || github.ref }}
    cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'delete'
    uses: VaultLearningGames/vault-publisher/.github/workflows/unity-build.yml@v1
    # Passed explicitly: `secrets: inherit` doesn't cross GitHub orgs.
    # This repo has no Unity seat secrets of its own; it uses the fielddaylab org's licence file.
    secrets:
      UNITY_LICENSE: ${{ secrets.FIELDDAY_UNITY_LICENSE_2019 }}

  preview:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: atom-touch
      artifact: ${{ needs.build.outputs.artifact }}

  remove-preview:
    if: github.event_name == 'delete'
    permissions:
      contents: read
      id-token: write
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: atom-touch
